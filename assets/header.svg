<svg width="1000" height="290" viewBox="0 0 1000 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hi, I'm Sonu Kumar - Enterprise Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#090e1a"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a47"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1b3550" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="998" height="288" rx="16" fill="url(#bg)" stroke="#1f6feb" stroke-opacity="0.35"/>
  <rect x="1" y="1" width="998" height="288" rx="16" fill="url(#grid)"/>

  <!-- Icon box -->
  <rect x="40" y="38" width="58" height="58" rx="12" fill="#0e2a47" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="69" y="75" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#38bdf8">&lt;/&gt;</text>

  <!-- Title -->
  <text x="118" y="68" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Hi 👋, I'm <tspan fill="#38bdf8">Sonu Kumar</tspan></text>
  <text x="118" y="95" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3">Enterprise Full Stack Developer</text>

  <!-- Description -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9fb3c8">
    <text x="40" y="140">I build and scale end-to-end products for real-world business problems,</text>
    <text x="40" y="164">with a strong focus on communication platforms, SaaS and high-availability</text>
    <text x="40" y="188">systems. I enjoy turning complex requirements into reliable, secure and</text>
    <text x="40" y="212">scalable solutions.</text>
  </g>

  <!-- Code window illustration -->
  <ellipse cx="850" cy="125" rx="120" ry="80" fill="#38bdf8" opacity="0.18" filter="url(#glow)"/>
  <rect x="735" y="38" width="230" height="172" rx="12" fill="url(#win)" stroke="#38bdf8" stroke-opacity="0.6"/>
  <path d="M735 50 a12 12 0 0 1 12 -12 h206 a12 12 0 0 1 12 12 v14 h-230z" fill="#0b2038"/>
  <circle cx="753" cy="51" r="4" fill="#ff5f56"/>
  <circle cx="768" cy="51" r="4" fill="#ffbd2e"/>
  <circle cx="783" cy="51" r="4" fill="#27c93f"/>
  <g>
    <rect x="753" y="80"  width="60"  height="7" rx="3.5" fill="#c084fc"/>
    <rect x="821" y="80"  width="90"  height="7" rx="3.5" fill="#38bdf8"/>
    <rect x="769" y="98"  width="110" height="7" rx="3.5" fill="#4ade80"/>
    <rect x="887" y="98"  width="40"  height="7" rx="3.5" fill="#64748b"/>
    <rect x="769" y="116" width="70"  height="7" rx="3.5" fill="#38bdf8"/>
    <rect x="847" y="116" width="80"  height="7" rx="3.5" fill="#fbbf24"/>
    <rect x="785" y="134" width="120" height="7" rx="3.5" fill="#64748b"/>
    <rect x="769" y="152" width="50"  height="7" rx="3.5" fill="#c084fc"/>
    <rect x="827" y="152" width="100" height="7" rx="3.5" fill="#4ade80"/>
    <rect x="753" y="170" width="90"  height="7" rx="3.5" fill="#38bdf8"/>
    <rect x="851" y="170" width="50"  height="7" rx="3.5" fill="#64748b"/>
    <rect x="753" y="188" width="36"  height="7" rx="3.5" fill="#fbbf24"/>
  </g>

  <!-- Badges -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="40"  y="236" width="150" height="30" rx="8" fill="#1a1440" stroke="#8b5cf6"/>
    <text x="115" y="256" fill="#c4b5fd">Full Stack Developer</text>

    <rect x="200" y="236" width="70"  height="30" rx="8" fill="#0e2a1c" stroke="#22c55e"/>
    <text x="235" y="256" fill="#86efac">MERN</text>

    <rect x="280" y="236" width="82"  height="30" rx="8" fill="#161b22" stroke="#e6edf3" stroke-opacity="0.6"/>
    <text x="321" y="256" fill="#ffffff">Next.js</text>

    <rect x="372" y="236" width="86"  height="30" rx="8" fill="#10281a" stroke="#4ade80"/>
    <text x="415" y="256" fill="#86efac">Node.js</text>

    <rect x="468" y="236" width="108" height="30" rx="8" fill="#0f2140" stroke="#60a5fa"/>
    <text x="522" y="256" fill="#93c5fd">PostgreSQL</text>

    <rect x="586" y="236" width="70"  height="30" rx="8" fill="#2a1114" stroke="#ef4444"/>
    <text x="621" y="256" fill="#fca5a5">Redis</text>

    <rect x="666" y="236" width="84"  height="30" rx="8" fill="#0c2236" stroke="#38bdf8"/>
    <text x="708" y="256" fill="#7dd3fc">Docker</text>

    <rect x="760" y="236" width="64"  height="30" rx="8" fill="#2b1d0a" stroke="#f59e0b"/>
    <text x="792" y="256" fill="#fcd34d">AWS</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
